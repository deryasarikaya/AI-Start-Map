<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Start Map{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="page-shell header-inner">
            <a class="brand" href="{{ url_for('landing') }}" aria-label="AI Start Map Startseite">
                <span class="brand-mark" aria-hidden="true">A</span>
                <span>AI Start Map</span>
            </a>
            <span class="header-note">Prozessdiagnostik für kleine Unternehmen</span>
        </div>
    </header>

    <main class="page-shell page-content">
        {% block content %}{% endblock %}
    </main>
    <script>
        document.querySelectorAll("form[data-disable-on-submit]").forEach((form) => {
            form.addEventListener("submit", () => {
                const button = form.querySelector("button[type='submit']");
                if (button) {
                    button.disabled = true;
                    button.setAttribute("aria-disabled", "true");
                    button.textContent = "Analyse wird gestartet …";
                }
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
