<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Start Map{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="page-shell header-inner">
            <a class="brand" href="{{ url_for('landing') }}" aria-label="AI Start Map Startseite">
                <span class="brand-mark" aria-hidden="true">AI</span>
                <span>AI START MAP</span>
            </a>
        </div>
    </header>

    <main class="page-shell page-content">
        {% block content %}{% endblock %}
    </main>
    <div class="processing-layer" data-processing-layer hidden role="status" aria-live="polite" aria-busy="true">
        <div class="processing-layer-card">
            <div class="processing-symbol" aria-hidden="true"><span></span><span></span><span></span></div>
            <strong data-processing-title>Ich prüfe deine Angaben.</strong>
            <p data-processing-copy>Du musst nichts weiter tun. Gleich geht es automatisch weiter.</p>
        </div>
    </div>
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
