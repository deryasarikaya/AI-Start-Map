business_pattern: A_field_service
business_example: Hausmeisterservice

diagnostic_focus: >
  Sind Fotos, Notizen und Belege nach dem Einsatz zuverlässig mit dem Auftrag
  verbunden? Die Informationen entstehen fast immer bereits während des
  Einsatzes. Das Problem ist selten, dass etwas fehlt — sondern dass es
  danach nicht mehr zusammenfindet. Die Kette lautet:
  Auftrag → Einsatz → Fotos, Notizen, Belege → Rechnung.

typical_workflows:
  - Anfrage oder Auftrag erhalten
  - Objekt und Kunde zuordnen
  - Einsatz planen
  - zum Objekt fahren
  - Arbeit vor Ort durchführen
  - zusätzliche Arbeiten oder Schäden feststellen
  - Fotos aufnehmen
  - Material verwenden oder einkaufen
  - Belege sammeln
  - ausgeführte Arbeiten festhalten
  - offene Punkte und Folgeeinsätze notieren
  - Einsatz abschließen
  - Angaben für die Rechnung zusammenstellen
  - Rechnung erstellen
  - Kunde oder Verwaltung informieren

channels:
  - Telefon
  - WhatsApp
  - E-Mail
  - SMS
  - persönlich
  - Sprachnachrichten
  - Fotos vom Smartphone
  - Papierzettel
  - Kalender
  - Rechnungssoftware, falls vorhanden

