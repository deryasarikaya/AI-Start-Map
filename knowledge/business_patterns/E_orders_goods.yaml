business_pattern: E_orders_goods
business_example: Blumenladen

diagnostic_focus: >
  Wie wird aus Nachrichten, Fotos und Sonderwünschen eine eindeutige,
  vollständige Bestellung? Der Engpass liegt fast immer auf der Kette
  Eingang → Vollständigkeit → Zuordnung → aktuelle Fassung → Fertigung →
  Übergabe. Nicht bei Marketing oder Sichtbarkeit.

typical_workflows:
  - Kundenanfrage oder Bestellung entgegennehmen
  - fehlende Angaben klären
  - Bestellung verbindlich erfassen
  - Ware und Material prüfen und vorbereiten
  - Produkt fertigen oder zusammenstellen
  - Lieferung oder Abholung organisieren
  - Übergabe durchführen
  - Zahlung oder Rechnung bearbeiten
  - Änderungen und Sonderfälle nachhalten

channels:
  - Telefon
  - WhatsApp
  - Instagram und andere soziale Netzwerke
  - E-Mail
  - persönlich im Laden
  - Website oder Bestellformular, falls vorhanden

domain_vocabulary:
  - Bestellung
  - Strauß
  - Gesteck
  - Arrangement
